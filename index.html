<style>
/* =========================================================
   STYLES
   All colors are defined once in :root (light) and
   :root[data-theme="dark"] (dark). Change them there.
   ========================================================= */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #1c1f23;
  --muted: #5d6670;
  --line: #dfe3e8;
  --soft: #f3f5f7;
  --accent: #1f5fad;
  --again: #b8352a;
  --hard: #9a5c00;
  --easy: #2a7440;
  --good-bg: #eaf5ec;
  --bad-bg: #fbecea;
  --star: #d39e00;
  --word-font: "Literata", Georgia, "Times New Roman", serif;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #16191d;
  --surface: #1d2126;
  --ink: #e9ecef;
  --muted: #a3acb6;
  --line: #333a42;
  --soft: #262b31;
  --accent: #82b2f0;
  --again: #f08376;
  --hard: #e3a94f;
  --easy: #72c58a;
  --good-bg: #1d3324;
  --bad-bg: #3a2220;
  --star: #f2c14e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui-font);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 760px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top, 0px)) 16px 40px; }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.brand { font-family: var(--word-font); font-weight: 600; font-size: 1.4rem; margin: 0 auto 0 0; }
.top-actions { display: flex; gap: 8px; }
.search { position: relative; flex: 1 1 100%; order: 3; }
.search input {
  width: 100%; min-height: 46px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
.results {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px);
  margin: 0; padding: 4px; list-style: none; max-height: 60vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
}
.results button {
  display: block; width: 100%; text-align: left; padding: 10px 12px;
  border: 0; background: transparent; border-radius: 8px; cursor: pointer;
}
.results button:hover, .results button:focus-visible { background: var(--soft); }
.results .r-a { font-weight: 600; }
.results .r-b { color: var(--muted); }
.results .r-ex { display: block; font-size: .88rem; color: var(--muted); font-style: italic; }
.results .none { padding: 10px 12px; color: var(--muted); }
@media (min-width: 700px) {
  .search { flex: 1 1 260px; order: 0; max-width: 340px; }
}

/* ---------- Buttons ---------- */
.btn {
  min-height: 44px; padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
.btn:hover { background: var(--soft); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: #10233d; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }

/* ---------- Mode tabs, direction and list selector ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  min-height: 44px; padding: 8px 13px; border: 0; background: var(--surface); cursor: pointer;
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.list-pick { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.list-pick label { color: var(--muted); font-size: .95rem; }
.list-pick select {
  min-height: 44px; padding: 8px 10px; max-width: 210px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}

/* ---------- Progress line ---------- */
.progress { margin-top: 14px; }
.progress-text { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: .95rem; color: var(--muted); }
.bar { height: 6px; margin-top: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; position: relative; }
.bar .prog { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--line); }
.bar .lrn { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--easy); }

/* ---------- Card (used by study, test and quiz) ---------- */
.card {
  position: relative; margin-top: 14px; min-height: 300px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px 26px; text-align: center;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
}
.study-card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card-tools { position: absolute; top: 8px; left: 12px; right: 8px; display: flex; align-items: center; gap: 2px; }
.chip { margin-right: auto; font-size: .85rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; }
.chip-hard { color: var(--hard); border-color: currentColor; }
.chip-learned, .chip-mastered { color: var(--easy); border-color: currentColor; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  font-size: 1.45rem; line-height: 1; cursor: pointer;
}
.icon-btn:hover { background: var(--soft); }
.icon-btn.on { color: var(--star); }
.icon-btn svg { width: 24px; height: 24px; }

/* Danish text uses the serif face. Meanings use the UI face. */
.da { font-family: var(--word-font); }
.prompt { font-size: clamp(2rem, 7.5vw, 3.2rem); font-weight: 600; line-height: 1.18; overflow-wrap: anywhere; }
.prompt.is-meaning { font-family: var(--ui-font); font-weight: 500; font-size: clamp(1.45rem, 5.4vw, 2.1rem); line-height: 1.3; }
.word-note { display: block; margin-top: 6px; font-family: var(--ui-font); font-weight: 400; font-size: 1rem; color: var(--muted); }
.back { width: 100%; max-width: 32em; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.answer { font-size: clamp(1.25rem, 4.6vw, 1.6rem); line-height: 1.4; overflow-wrap: anywhere; }
.answer.da { font-size: clamp(1.6rem, 6vw, 2.3rem); font-weight: 600; }
.example { margin-top: 12px; font-family: var(--word-font); font-style: italic; font-size: 1.08rem; line-height: 1.55; }
.example-en { margin-top: 4px; color: var(--muted); font-size: 1rem; line-height: 1.5; }
.word-stats { margin-top: 14px; font-size: .85rem; color: var(--muted); }
.hint { margin-top: 22px; color: var(--muted); font-size: .95rem; }

/* ---------- Study rating buttons ---------- */
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
.rate button:disabled { opacity: .4; cursor: default; }
.rate button:disabled:hover { background: var(--surface); }
.rate b { white-space: nowrap; }
@media (max-width: 420px) { .rate { gap: 5px; } .rate b { font-size: .9rem; } }
.rate button {
  min-height: 56px; padding: 6px 2px; cursor: pointer;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.rate button:hover { background: var(--soft); }
.rate b { font-size: 1.05rem; }
.rate small { font-size: .78rem; color: var(--muted); }
.rate .again { border-color: var(--again); color: var(--again); }
.rate .hard { border-color: var(--hard); color: var(--hard); }
.rate .easy { border-color: var(--easy); color: var(--easy); }
kbd { font-family: inherit; font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.rate kbd, .tf kbd { display: none; margin-left: 6px; }
.keys { margin-top: 14px; color: var(--muted); font-size: .9rem; display: none; }
@media (hover: hover) and (pointer: fine) {
  .rate kbd, .tf kbd { display: inline; }
  .keys { display: block; }
}

/* ---------- Empty state ---------- */
.empty { margin-top: 14px; padding: 40px 20px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
.empty p { margin: 0 0 16px; font-size: 1.1rem; }

/* ---------- Test and quiz ---------- */
.test-status { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin-top: 14px; color: var(--muted); }
.test-status strong { color: var(--ink); }
.timer { font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 600; color: var(--ink); }
.timer.low { color: var(--again); }
.candidate-label { margin-top: 18px; font-size: .9rem; color: var(--muted); }
.candidate {
  width: 100%; max-width: 30em; margin-top: 6px; padding: 14px 16px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--soft);
  font-size: clamp(1.2rem, 4.4vw, 1.5rem); line-height: 1.4; overflow-wrap: anywhere;
}
.candidate.da { font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 600; }
.candidate.was-true { border-color: var(--easy); }
.candidate.was-false { border-color: var(--again); text-decoration: line-through; text-decoration-thickness: 2px; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.tf button {
  min-height: 64px; font-size: 1.15rem; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
}
.tf button:hover { background: var(--soft); }
.tf .yes { border-color: var(--easy); color: var(--easy); }
.tf .no { border-color: var(--again); color: var(--again); }
.feedback { margin-top: 12px; padding: 16px; border-radius: 12px; border: 1.5px solid; }
.feedback.good { background: var(--good-bg); border-color: var(--easy); }
.feedback.bad { background: var(--bad-bg); border-color: var(--again); }
.feedback h3 { margin: 0 0 6px; font-size: 1.15rem; }
.feedback.good h3 { color: var(--easy); }
.feedback.bad h3 { color: var(--again); }
.feedback .fb-label { font-size: .85rem; color: var(--muted); }
.feedback .fb-answer { font-size: clamp(1.3rem, 4.8vw, 1.7rem); font-weight: 600; line-height: 1.3; }
.feedback .fb-answer.da { font-family: var(--word-font); }
.feedback .fb-pair { margin-top: 4px; font-size: 1rem; color: var(--muted); }
.feedback .fb-pair b { font-family: var(--word-font); }
.feedback .fb-note { margin-top: 6px; color: var(--muted); font-size: .95rem; }
.feedback .example { margin-top: 10px; }
.feedback .btn { margin-top: 14px; width: 100%; min-height: 52px; font-size: 1.05rem; }
.end-link { margin-top: 12px; }

/* ---------- Results ---------- */
.result { margin-top: 14px; }
.result h2 { font-family: var(--word-font); font-size: 1.9rem; margin: 0 0 12px; }
.result h3 { margin: 22px 0 6px; font-size: 1.05rem; }
.missed { list-style: none; margin: 8px 0 16px; padding: 0; border-top: 1px solid var(--line); }
.missed li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.missed b { font-family: var(--word-font); }
.missed span { color: var(--muted); }
.missed i { display: block; font-family: var(--word-font); font-size: .95rem; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Stat grid (results and stats dialog) ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 0; }
.stats div { padding: 10px 12px; background: var(--soft); border-radius: 10px; }
.stats dt { font-size: .85rem; color: var(--muted); }
.stats dd { margin: 0; font-size: 1.45rem; font-weight: 600; }

/* ---------- Dialog ---------- */
dialog {
  width: min(600px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 20px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { margin: 0 0 12px; font-family: var(--word-font); }
dialog h3 { margin: 22px 0 8px; font-size: 1rem; }
.note { color: var(--muted); font-size: .9rem; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; }
#statsGrid { grid-template-columns: repeat(2, 1fr); }
.reset-confirm { margin-top: 16px; padding: 14px; border: 1.5px solid var(--again); border-radius: 12px; background: var(--bad-bg); }
.reset-confirm p { margin: 0 0 6px; }
.reset-confirm .check { min-height: 40px; }
.reset-confirm .row { margin-top: 8px; }
.btn.danger:disabled { opacity: .45; cursor: default; }
.btn.danger { background: var(--again); border-color: var(--again); color: #fff; }
#statsGrid dd { font-size: 1.8rem; }
.dialog-close { justify-content: space-between !important; gap: 8px; display: flex; justify-content: flex-end; margin-top: 18px; }

/* ---------- Toast and footer ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
  background: var(--ink); color: var(--bg); font-size: .95rem; z-index: 50;
}
footer { margin-top: 36px; color: var(--muted); font-size: .85rem; }
.foot-link { color: var(--muted); margin-left: 8px; }
</style>
</head>

<script>
"use strict";

/* =========================================================
   SECTION 1: SETTINGS
   Change learning behaviour here. Nothing else needs editing.
   ========================================================= */
const CONFIG = {
  storagePrefix: "dkvocab.v2.",            // Local Storage key prefix.
  oldPrefix: "dkvocab.v1.",                // Previous version: progress is converted once.
  intervals: [0, 1, 2, 4, 8, 16, 30],      // Days until a correct word returns, by level 0..6.
  learnedLevel: 3,                         // 3 correct days = learned.
  masteredLevel: 5,                        // 5 correct days = mastered.
  clearHardAfter: 2,                       // Correct answers in a row that remove the Hard mark.
  againGap: 3,                             // Wrong/Again words return after this many cards.
  hardGap: 10,                             // Hard words return after this many cards (and tomorrow).
  newEvery: 3,                             // While reviews are due, every Nth card is a new word.
  recentSize: 25,                          // Never repeat any of the last N cards (unless the list is tiny).
  quizSize: 20,                            // Words per quiz.
  quizSeconds: 90,                         // Total time per quiz.
  trueRatio: 0.5,                          // Share of test questions that show the correct answer.
  searchLimit: 60,                         // Maximum search results.
  dailyGoal: 30,                           // Words per day shown as the goal bar under the menu.
  backSteps: 50,                           // How many cards the Back button can go back in Study.
  speechLang: "da-DK",
  speechRate: 0.9
};
const MAX_LEVEL = CONFIG.intervals.length - 1;


/* =========================================================
   SECTION 2: LOCAL STORAGE HELPERS
   ========================================================= */
const store = {
  get(key, fallback, prefix) {
    try {
      const v = localStorage.getItem((prefix || CONFIG.storagePrefix) + key);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(CONFIG.storagePrefix + key, JSON.stringify(value)); }
    catch (e) { console.warn("Could not save to Local Storage:", e); }
  },
  remove(key) {
    try { localStorage.removeItem(CONFIG.storagePrefix + key); } catch (e) {}
  }
};


/* =========================================================
   SECTION 3: PREPARE VOCABULARY
   Every entry becomes one card; only completely empty rows are skipped.
   Card id = the Danish word (plus #2, #3 for repeated Danish words), so
   progress survives when you improve a meaning or add an example.
   ========================================================= */
/* Normalise a Danish headword for duplicate checks: "at arbejde (verbum)" -> "arbejde" */
function normDa(s) {
  return String(s).toLowerCase().replace(/\(.*?\)/g, " ").replace(/^\s*(at|en|et)\s+/, "").replace(/\s+/g, " ").trim();
}
/* Key English words, used to check that two meanings match. */
const EN_STOP = new Set("the and for with that this from into over than also very some such only just like something someone used make made more most much about have been their there what when which while".split(" "));
function enWords(s) {
  return new Set(String(s).toLowerCase().replace(/\(.*?\)/g, " ").split(/[^a-z']+/).filter(w => w.length >= 3 && !EN_STOP.has(w)));
}
function sharesWord(a, b) {
  const A = enWords(a);
  for (const w of enWords(b)) if (A.has(w)) return true;
  return false;
}

function buildCards(raw, builtIn, useBuiltIn) {
  const list = [];
  const seenDa = new Map();
  const seenPair = new Map();

  function add(item, source) {
    if (!item) return null;
    let danish = String(item.danish == null ? "" : item.danish).trim();
    // "english" is the field name now; "meaning" is still accepted from older lists.
    let english = String(item.english != null ? item.english : item.meaning != null ? item.meaning : "").trim();
    const exDa = String(item.example_danish != null ? item.example_danish : item.example != null ? item.example : "").trim();
    const exEn = String(item.example_english == null ? "" : item.example_english).trim();

    // Rescue rows typed as "word → meaning" in the Danish column.
    if (!english && danish.includes("→")) {
      const parts = danish.split("→");
      danish = parts[0].trim();
      english = parts.slice(1).join("→").trim();
    }
    if (!danish) return null;

    const n = (seenDa.get(danish) || 0) + 1;
    seenDa.set(danish, n);
    const pairKey = danish + "|" + english;               // id format of version 1 (for conversion)
    const pn = (seenPair.get(pairKey) || 0) + 1;
    seenPair.set(pairKey, pn);

    const card = {
      id: n === 1 ? danish : danish + "#" + n,
      oldId: pn === 1 ? pairKey : pairKey + "#" + pn,
      danish: danish,
      meaning: english || "(no English added yet)",       // the English meaning
      example: exDa,                                      // Danish example sentence
      exampleEn: exEn,                                    // English translation of the example
      category: item.category ? String(item.category).trim() : "",
      source: source,                                     // "mine" or "common"
      norm: normDa(danish),
      lower: danish.toLowerCase(),
      search: ""
    };
    list.push(card);
    return card;
  }

  for (const item of raw) add(item, "mine");

  if (useBuiltIn) {
    const byNorm = new Map();
    for (const c of list) {
      if (!byNorm.has(c.norm)) byNorm.set(c.norm, []);
      byNorm.get(c.norm).push(c);
    }
    for (const item of builtIn) {
      const key = normDa(item.danish || "");
      const mine = byNorm.get(key);
      if (!mine) { add(item, "common"); continue; }
      // Already in your list: borrow the example if your word has none and the meanings match.
      for (const c of mine) {
        if (!c.example && sharesWord(c.meaning, item.english || "")) {
          c.example = item.example_danish || "";
          c.exampleEn = item.example_english || "";
        }
      }
    }
  }

  for (const c of list) c.search = [c.danish, c.meaning, c.example, c.exampleEn].join("\n").toLowerCase();
  return list;
}

/* Owner mode: open the site with #admin at the end of the address to see
   detailed numbers, the built-in word switch and per-word statistics.
   This only hides things from normal visitors; it is not a password. */
const isAdmin = /admin/i.test(location.hash) || /[?&]admin\b/i.test(location.search);
window.addEventListener("hashchange", () => location.reload());

const useBuiltIn = store.get("builtin", true);
const cards = buildCards(
  typeof vocabulary !== "undefined" && Array.isArray(vocabulary) ? vocabulary : [],
  typeof builtInVocabulary !== "undefined" && Array.isArray(builtInVocabulary) ? builtInVocabulary : [],
  useBuiltIn
);
const idIndex = new Map(cards.map((c, i) => [c.id, i]));


/* =========================================================
   SECTION 4: DATES
   Days are whole local calendar days, counted as integers.
   ========================================================= */
function today() {
  const d = new Date();
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
}
function daysAgoText(day) {
  const diff = today() - day;
  if (diff <= 0) return "today";
  if (diff === 1) return "yesterday";
  return diff + " days ago";
}


/* =========================================================
   SECTION 5: SAVED STATE

   progress[id] = {
     l: level 0..6        d: day it is due again     h: 1 if marked Hard
     f: 1 if favorite     s: times seen              n: times answered (any answer)
     c: times correct     w: times wrong             r: correct answers in a row
     t: last studied day  u: last day the level went up
   }
   sched  = saved shuffled order of all cards, position, recent cards, short-term queue
   daily  = words studied today     streak = consecutive study days
   review = words missed in the last test or quiz
   ========================================================= */
let progress = store.get("progress", null);
if (!progress) progress = convertOldProgress();
let daily = store.get("daily", null) || store.get("daily", { day: 0, ids: [], reviews: 0 }, CONFIG.oldPrefix);
let streak = store.get("streak", null) || store.get("streak", { last: 0, count: 0 }, CONFIG.oldPrefix);
let reviewIds = store.get("review", []);
let sched = store.get("sched", null);
let dailySet = new Set(daily.ids);

/* One-time conversion from version 1 (keeps favorites, Hard marks and some level). */
function convertOldProgress() {
  const old = store.get("progress", null, CONFIG.oldPrefix);
  const out = {};
  if (!old) return out;
  for (const c of cards) {
    const o = old[c.oldId];
    if (!o) continue;
    out[c.id] = {
      l: o.h ? 0 : Math.min(o.b || 0, 2), d: o.d || 0, h: o.h ? 1 : 0, f: o.f ? 1 : 0,
      s: o.n || 0, n: o.n || 0, c: o.b > 0 ? 1 : 0, w: o.h ? 1 : 0, r: 0, t: 0, u: 0
    };
  }
  return out;
}

function dataSignature() {
  if (!cards.length) return "0";
  return cards.length + ":" + cards[0].id + ":" + cards[cards.length - 1].id;
}

function shuffle(arr) { // Fisher-Yates: every order is equally likely
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function initSchedule() {
  const sig = dataSignature();
  if (!sched || sched.sig !== sig || !Array.isArray(sched.bag)) {
    // New or changed word list: make a fresh shuffled order. Word progress is kept.
    sched = {
      sig: sig,
      bag: shuffle(Array.from({ length: cards.length }, (_, i) => i)),
      ptr: 0,
      counter: sched ? sched.counter || 0 : 0,
      recent: sched ? sched.recent || [] : [],
      soon: sched ? sched.soon || [] : [],
      current: sched ? sched.current : null
    };
  }
  sched.recent = sched.recent.filter(id => idIndex.has(id));
  sched.soon = sched.soon.filter(s => idIndex.has(s.id));
}

function ensureToday() {
  const t = today();
  if (daily.day !== t) {
    daily = { day: t, ids: [], reviews: 0 };
    dailySet = new Set();
  }
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 300);
}
function saveAll() {
  clearTimeout(saveTimer);
  saveTimer = null;
  store.set("progress", progress);
  store.set("sched", sched);
  store.set("daily", daily);
  store.set("streak", streak);
  store.set("review", reviewIds);
}
window.addEventListener("pagehide", saveAll);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveAll(); });


/* =========================================================
   SECTION 6: WORD STATUS AND THE LEARNING RULES
   ========================================================= */
function P(i) { return progress[cards[i].id]; }
function getP(id) {
  return progress[id] || (progress[id] = { l: 0, d: 0, h: 0, f: 0, s: 0, n: 0, c: 0, w: 0, r: 0, t: 0, u: 0 });
}
function isNewP(p) { return !p || !p.n; }
function isHardP(p) { return !!(p && p.n && p.h); }
function isLearnedP(p) { return !!(p && p.n && !p.h && p.l >= CONFIG.learnedLevel); }
function isMasteredP(p) { return !!(p && p.n && !p.h && p.l >= CONFIG.masteredLevel); }

function statusOf(p) {
  if (isNewP(p)) return { key: "new", label: "New" };
  if (p.h) return { key: "hard", label: "Hard" };
  if (p.l >= CONFIG.masteredLevel) return { key: "mastered", label: "Mastered" };
  if (p.l >= CONFIG.learnedLevel) return { key: "learned", label: "Learned" };
  return { key: "learning", label: "Learning " + p.l + "/" + CONFIG.learnedLevel };
}

/* The whole learning algorithm.
   result = "correct" (Easy, or a right test answer)
            "hard"    (Hard)
            "wrong"   (Again, or a wrong test answer)
   - Correct: +1 level, at most once per day, so "learned" needs 3 separate days.
   - Hard: level is halved, word is marked Hard, returns later today and tomorrow.
   - Wrong: level 0, marked Hard, returns after a few cards.
   - The Hard mark is removed after 2 correct answers in a row. */
function applyResult(id, result) {
  const p = getP(id);
  const t = today();
  p.n++;
  p.t = t;
  if (result === "correct") {
    p.c++;
    p.r++;
    if (p.u !== t) { p.l = Math.min(p.l + 1, MAX_LEVEL); p.u = t; }
    if (p.h && p.r >= CONFIG.clearHardAfter) p.h = 0;
    p.d = t + CONFIG.intervals[p.l];
    removeSoon(id);
  } else if (result === "hard") {
    p.r = 0;
    p.l = Math.floor(p.l / 2);
    p.u = 0;                        // the next correct answer may raise the level again
    p.h = 1;
    p.d = t + 1;
    addSoon(id, CONFIG.hardGap);
  } else {
    p.w++;
    p.r = 0;
    p.l = 0;
    p.u = 0;
    p.h = 1;
    p.d = t;
    addSoon(id, CONFIG.againGap);
  }
  recordStudy(id);
}

function markSeen(id) { getP(id).s++; }

function recordStudy(id) {
  ensureToday();
  const t = today();
  daily.reviews++;
  if (!dailySet.has(id)) { dailySet.add(id); daily.ids.push(id); }
  if (streak.last !== t) {
    streak.count = streak.last === t - 1 ? streak.count + 1 : 1;
    streak.last = t;
  }
  scheduleSave();
}

/* Word lists. Add new lists here and as an <option> in the HTML. */
function filterPredicate(key) {
  if (key.startsWith("cat:")) {
    const cat = key.slice(4);
    return i => cards[i].category === cat;
  }
  switch (key) {
    case "new":      return i => isNewP(P(i));
    case "hard":     return i => isHardP(P(i));
    case "learned":  return i => isLearnedP(P(i));
    case "mastered": return i => isMasteredP(P(i));
    case "fav":      return i => { const p = P(i); return !!(p && p.f); };
    case "today":    return i => dailySet.has(cards[i].id);
    case "mine":     return i => cards[i].source === "mine";
    case "common":   return i => cards[i].source === "common";
    case "review": { const set = new Set(reviewIds); return i => set.has(cards[i].id); }
    default:         return () => true;
  }
}


/* =========================================================
   SECTION 7: CARD PICKER
   Used by Study and Test. Priority for "All words":
   1. Short-term queue: wrong/Again words after 3 cards, Hard words after 10.
   2. Words due today. Hard words first, then the most overdue.
      Every 3rd card is a new word so new learning never stops.
   3. New words in a fair shuffled order of the whole list. The order is
      saved, so a reload continues where it stopped.
   4. Nothing new or due: practise Hard words, then words not learned yet.
   The last 25 cards are never repeated.
   ========================================================= */
let filterBag = null; // shuffled order for the other lists (memory only)

function pushRecent(id) {
  const r = sched.recent.filter(x => x !== id);
  r.push(id);
  if (r.length > CONFIG.recentSize) r.splice(0, r.length - CONFIG.recentSize);
  sched.recent = r;
}
function addSoon(id, gap) {
  sched.soon = sched.soon.filter(s => s.id !== id);
  sched.soon.push({ id: id, at: sched.counter + gap });
}
function removeSoon(id) { sched.soon = sched.soon.filter(s => s.id !== id); }

function nextFromBag(test) {
  const n = sched.bag.length;
  for (let step = 0; step < n; step++) {
    if (sched.ptr >= n) { shuffle(sched.bag); sched.ptr = 0; } // a full round is done: reshuffle
    const i = sched.bag[sched.ptr++];
    if (i < cards.length && test(i)) return i;
  }
  return -1;
}

function pickAll(recent) {
  const t = today();
  const notRecent = i => !recent.has(cards[i].id);

  // Best due word: Hard before others, then the most overdue. Random start avoids alphabetical bias.
  let due = -1, dueHard = false, dueDay = Infinity;
  const start = Math.floor(Math.random() * cards.length);
  for (let k = 0; k < cards.length; k++) {
    const i = (start + k) % cards.length;
    const p = progress[cards[i].id];
    if (!p || !p.n || p.d > t || !notRecent(i)) continue;
    const hard = !!p.h;
    if (due < 0 || (hard && !dueHard) || (hard === dueHard && p.d < dueDay)) {
      due = i; dueHard = hard; dueDay = p.d;
    }
  }

  const wantNew = due < 0 || (!dueHard && sched.counter % CONFIG.newEvery === 0) || (dueHard && sched.counter % (CONFIG.newEvery * 2) === 0);
  if (wantNew) {
    const i = nextFromBag(i => isNewP(P(i)) && notRecent(i));
    if (i >= 0) return i;
  }
  if (due >= 0) return due;

  let i = nextFromBag(i => isHardP(P(i)) && notRecent(i));
  if (i >= 0) return i;
  i = nextFromBag(i => !isLearnedP(P(i)) && notRecent(i));
  if (i >= 0) return i;
  i = nextFromBag(notRecent);
  if (i >= 0) return i;
  return cards.length ? Math.floor(Math.random() * cards.length) : -1;
}

function pickFiltered(recent, test) {
  let fallback = -1;
  for (let pass = 0; pass < 2; pass++) {
    if (!filterBag || filterBag.key !== ui.filter || filterBag.ptr >= filterBag.list.length) {
      const list = [];
      for (let i = 0; i < cards.length; i++) if (test(i)) list.push(i);
      filterBag = { key: ui.filter, list: shuffle(list), ptr: 0 };
    }
    if (!filterBag.list.length) return -1;
    while (filterBag.ptr < filterBag.list.length) {
      const i = filterBag.list[filterBag.ptr++];
      if (!test(i)) continue;                 // left the list since the order was made
      if (!recent.has(cards[i].id)) return i;
      if (fallback < 0) fallback = i;         // tiny list: allow a recent card
    }
  }
  return fallback;
}

function pickNext() {
  if (!cards.length) return -1;
  sched.counter++;
  const test = filterPredicate(ui.filter);
  const recent = new Set(sched.recent);

  let best = -1;
  for (let k = 0; k < sched.soon.length; k++) {
    const s = sched.soon[k];
    if (s.at <= sched.counter && test(idIndex.get(s.id)) && (best < 0 || s.at < sched.soon[best].at)) best = k;
  }
  if (best >= 0) return idIndex.get(sched.soon.splice(best, 1)[0].id);

  return ui.filter === "all" ? pickAll(recent) : pickFiltered(recent, test);
}


/* =========================================================
   SECTION 8: DISPLAY HELPERS AND DIRECTION
   ui.dir = "da": Danish → English. The Danish word is shown, everything
                  the learner reads afterwards (answer, feedback) is English.

/* Danish text: grammar notes like "(substantiv/noun)" are shown smaller. */
function setDanish(node, text) {
  node.className = node.className.replace(/\bis-meaning\b/, "").trim();

  node.lang = "da";

  const main = note ? text.replace(/\(.*?\)/g, " ").replace(/\s+/g, " ").trim() : text;
  node.textContent = main || text;
  if (note && main) {
    const small = document.createElement("small");
    small.className = "word-note";
    small.textContent = note;
    node.append(small);

}
function setMeaning(node, text, isPrompt) {
  node.classList.remove("da");
  node.classList.toggle("is-meaning", !!isPrompt);
  node.lang = "en";
  node.textContent = text;
}
function setFavButton(btn, p) {

/* Show the Danish example and its English translation (when available). */

function formatDays(d) { return d === 1 ? "1 day" : d + " days"; }

function setDirection(dir) {

/* =========================================================
   SECTION 9: STUDY MODE (flashcards)
   ========================================================= */
const EMPTY_TEXT = {
  all: "No words found. Add words to the vocabulary list at the top of the HTML file.",

function showCard(i, goingBack) {

    sched.current = cards[i].id;

function showNext() { showCard(pickNext()); }

/* Back: return to the previous card in Study. Nothing is rated or changed. */
function goBack() {

function renderCard() {

    ? "Seen " + p.s + "x, correct " + p.c + ", wrong " + p.w + ", level " + p.l + "/" + MAX_LEVEL + (p.t ? ", last studied " + daysAgoText(p.t) : "")
    : "First time";

  // Preview what Easy will do.

  const nextLevel = !p ? 1 : (p.u === t ? p.l : Math.min(p.l + 1, MAX_LEVEL));

function flip() {

function rate(kind) {
  if (ui.mode !== "study" || ui.current < 0) return;
  applyResult(cards[ui.current].id, kind === "easy" ? "correct" : kind === "hard" ? "hard" : "wrong");

function toggleFavorite(i) {

  const p = getP(cards[i].id);
  p.f = p.f ? 0 : 1;
  scheduleSave();
  return p;
}


/* =========================================================
   SECTION 10: TEST AND QUIZ (true or false)
   Danish → English: a Danish word is shown with an English meaning that is
   correct about half the time. English → Danish: an English meaning is
   shown with a Danish word.
   The user answers Correct or Incorrect.
   Test: endless, uses the chosen word list and the same smart picker
         as Study (Hard and due words first).
   Quiz: 20 random words from the whole list, 90 seconds in total.
   Every answer updates the word's progress.
   ========================================================= */
const session = {
  kind: "test", list: null, pos: 0, total: 0,
  q: null, answered: false,
  correct: 0, wrong: 0, missed: [],
  startTime: 0, endTime: 0, timer: null
};

/* ---- Wrong-answer generator ----
   Picks another word's English meaning that:
   - is a different word (not the same spelling or word family)
   - shares no key words with the real meaning (so it is really wrong)
   - looks similar (verb for verb, similar length) so it is not obvious. */
const STOP = new Set(("that this with from about have been into over than then them they their there what when which while also more most much very some such only just like make made used than være have være være noget nogen eller også meget andre andet anden ikke være blive kunne skulle ville").split(" "));

function tokens(c) {
  if (!c.tok) {
    c.tok = new Set(c.meaning.toLowerCase().replace(/\(.*?\)/g, " ").split(/[^a-zæøåéüäö]+/).filter(w => w.length >= 4 && !STOP.has(w)));
  }
  return c.tok;
}
function stem(c) {
  return c.lower.replace(/\(.*?\)/g, "").replace(/^(at|en|et|at være)\s+/, "").trim().slice(0, 5);
}
function looksLikeVerb(c) { return /(^|[\/,;]\s*)to\s/i.test(c.meaning); }

function pickDistractor(i) {
  const c = cards[i];
  const tok = tokens(c);
  const st = stem(c);
  const verb = looksLikeVerb(c);
  let best = -1, bestScore = Infinity;
  for (let tries = 0; tries < 60; tries++) {
    const j = Math.floor(Math.random() * cards.length);
    if (j === i) continue;
    const d = cards[j];
    if (d.lower === c.lower || d.meaning === c.meaning) continue;
    const ds = stem(d);
    if (st.length >= 4 && ds.length >= 4 && ds === st) continue;          // same word family
    let overlap = false;
    for (const w of tokens(d)) if (tok.has(w)) { overlap = true; break; }
    if (overlap) continue;                                                // could be a synonym
    if (d.norm === c.norm || c.meaning.toLowerCase().includes(d.lower) || d.meaning.toLowerCase().includes(c.lower)) continue;
    if (d.meaning.startsWith("(no English")) continue;
    let score = Math.abs(d.meaning.length - c.meaning.length) / 12;
    if (looksLikeVerb(d) !== verb) score += 3;
    score += Math.random();                                               // keep variety
    if (score < bestScore) { best = j; bestScore = score; }
    if (tries > 20 && bestScore < 1.5) break;
  }
  return best;
}

function makeQuestion(i) {
  let shown = i;
  if (Math.random() >= CONFIG.trueRatio) {
    const d = pickDistractor(i);
    if (d >= 0) shown = d;
  }
  return { i: i, shown: shown, isTrue: shown === i };
}

function startSession(kind, customList) {
  stopTimer();
  Object.assign(session, {
    kind: kind, pos: 0, q: null, answered: false,
    correct: 0, wrong: 0, missed: [], startTime: Date.now(), endTime: 0
  });
  if (customList) {
    session.list = shuffle(customList.slice());
    session.total = session.list.length;
  } else if (kind === "quiz") {
    // 20 different random words from the whole vocabulary.
    const all = Array.from({ length: cards.length }, (_, i) => i);
    const n = Math.min(CONFIG.quizSize, all.length);
    for (let k = 0; k < n; k++) {
      const j = k + Math.floor(Math.random() * (all.length - k));
      const t = all[k]; all[k] = all[j]; all[j] = t;
    }
    session.list = all.slice(0, n);
    session.total = n;
  } else {
    session.list = null;   // endless test: the picker chooses each word
    session.total = 0;
  }
  setMode(kind);
  if (kind === "quiz" && !customList) startTimer();
  nextQuestion();
}

function nextQuestion() {
  let i;
  if (session.list) {
    if (session.pos >= session.list.length) { finishSession(); return; }
    i = session.list[session.pos];
  } else {
    i = pickNext();
    if (i < 0) {
      if (cards.length && ui.filter !== "all") {
        toast("That list is empty, so the test uses all words.");
        setFilter("all", true);
        i = pickNext();
      }
      if (i < 0) { finishSession(); return; }
    }
    pushRecent(cards[i].id);
  }
  markSeen(cards[i].id);
  session.q = makeQuestion(i);
  session.answered = false;
  renderQuestion();
  $("yesBtn").focus({ preventScroll: true });
}

function renderQuestion() {
  const q = session.q;
  if (!q) return;
  const c = cards[q.i];
  const shown = cards[q.shown];

  $("qLabel").textContent = session.kind === "quiz" ? "Quiz" : "Test";
  if (ui.dir === "da") {
    setDanish($("qPrompt"), c.danish);
    $("qCandLabel").textContent = "Does it mean (English):";
    setMeaning($("qCandidate"), shown.meaning, false);
  } else {
    setMeaning($("qPrompt"), c.meaning, true);
    $("qCandLabel").textContent = "Is it this Danish word:";
    setDanish($("qCandidate"), shown.danish);
  }
  $("qCandidate").classList.add("candidate");
  $("qCandidate").classList.toggle("was-true", session.answered && q.isTrue);
  $("qCandidate").classList.toggle("was-false", session.answered && !q.isTrue);
  setFavButton($("qFavBtn"), progress[c.id]);

  $("tfRow").hidden = session.answered;
  $("feedback").hidden = !session.answered;
  renderStatus();
}

function renderStatus() {
  const answered = session.correct + session.wrong;
  const num = session.pos + 1;
  $("qProgress").textContent = session.total ? "Question " + Math.min(num, session.total) + "/" + session.total : "Question " + num;
  $("qScore").innerHTML = "";
  const s = document.createElement("strong");
  s.textContent = session.correct + " / " + answered;
  $("qScore").append("Score ", s, answered ? " (" + Math.round(session.correct / answered * 100) + "%)" : "");
}

function answer(userSaysCorrect) {
  if (!session.q || session.answered || !(ui.mode === "test" || ui.mode === "quiz")) return;
  const q = session.q;
  const c = cards[q.i];
  const shown = cards[q.shown];
  const right = userSaysCorrect === q.isTrue;
  session.answered = true;

  if (right) session.correct++;
  else { session.wrong++; if (!session.missed.includes(q.i)) session.missed.push(q.i); }
  applyResult(c.id, right ? "correct" : "wrong");

  // Feedback: always show the right pair; explain the wrong option; show the example.
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "good" : "bad");
  $("fbTitle").textContent = right ? "✅ Right!" : "❌ Not quite.";
  // 1. Correct answer, always in the language being learned.
  const ans = $("fbAnswer");
  if (ui.dir === "da") { ans.textContent = c.meaning; ans.classList.remove("da"); ans.lang = "en"; }
  else { ans.textContent = cleanForSpeech(c.danish); ans.classList.add("da"); ans.lang = "da"; }

  // 2. The full pair, so the learner sees both sides together.
  const pair = $("fbPair");
  pair.innerHTML = "";
  const b = document.createElement("b");
  b.lang = "da";
  b.textContent = c.danish;
  pair.append(b, " = " + c.meaning);

  // 3. If a wrong option was shown, say what it really means (in English).
  const note = $("fbNote");
  if (!q.isTrue) {
    note.textContent = ui.dir === "da"
      ? "\u201c" + shown.meaning + "\u201d is the English for \u201c" + shown.danish + "\u201d."
      : "\u201c" + shown.danish + "\u201d means \u201c" + shown.meaning + "\u201d.";
    note.hidden = false;
  } else {
    note.hidden = true;
  }

  // 4. Example sentence and its English translation.
  setExample($("fbExample"), c, $("fbExampleEn"));

  renderQuestion();
  renderProgress();
  $("qNextBtn").textContent = (session.total && session.pos + 1 >= session.total) ? "See result" : "Next question";
  $("qNextBtn").focus({ preventScroll: true });
}

function goNextQuestion() {
  if (!session.answered) return;
  session.pos++;
  nextQuestion();
}

/* ---- Quiz timer ---- */
function startTimer() {
  $("qTimer").hidden = false;
  session.endTime = session.startTime + CONFIG.quizSeconds * 1000;
  tick();
  session.timer = setInterval(tick, 250);
}
function stopTimer() {
  if (session.timer) clearInterval(session.timer);
  session.timer = null;
  $("qTimer").hidden = true;
}
function tick() {
  const left = Math.max(0, session.endTime - Date.now());
  const sec = Math.ceil(left / 1000);
  $("qTimer").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  $("qTimer").classList.toggle("low", sec <= 15);
  if (left <= 0) {
    toast("Time is up.");
    finishSession();
  }
}
function timeText(ms) {
  const sec = Math.round(ms / 1000);
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

/* ---- Results ---- */
function finishSession() {
  const wasQuiz = session.kind === "quiz" && !!session.timer;
  stopTimer();
  const used = Math.min(Date.now() - session.startTime, wasQuiz ? CONFIG.quizSeconds * 1000 : Infinity);
  const answered = session.correct + session.wrong;
  const total = session.total || answered;
  const pct = total ? Math.round(session.correct / total * 100) : 0;

  $("resultTitle").textContent = answered ? pct + "% correct" : "No answers yet";
  const rows = [["Correct", session.correct], ["Incorrect", session.wrong]];
  if (session.total) rows.push(["Not answered", Math.max(0, session.total - answered)]);
  rows.push(["Score", pct + "%"], ["Time used", timeText(used)]);
  fillStatGrid($("resultGrid"), rows);

  // Review suggestions = every word answered wrong.
  reviewIds = session.missed.map(i => cards[i].id);
  scheduleSave();
  const ul = $("missedList");
  ul.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const i of session.missed) {
    const c = cards[i];
    const li = document.createElement("li");
    const b = document.createElement("b");
    b.lang = "da";
    b.textContent = c.danish;
    const span = document.createElement("span");
    span.textContent = "  " + c.meaning;
    li.append(b, span);
    if (c.example) {
      const ex = document.createElement("i");
      ex.lang = "da";
      ex.textContent = c.example + (c.exampleEn ? "  (" + c.exampleEn + ")" : "");
      li.append(ex);
    }
    frag.append(li);
  }
  ul.append(frag);
  const any = session.missed.length > 0;
  $("missedTitle").textContent = any ? "Words to review (" + session.missed.length + ")" : "No words to review. Well done.";
  ul.hidden = !any;
  $("studyMissedBtn").hidden = !any;
  $("testMissedBtn").hidden = !any;
  $("againSessionBtn").textContent = session.kind === "quiz" ? "New quiz" : "New test";
  setMode("result");
}


/* =========================================================
   SECTION 11: MODES AND PROGRESS LINE
   ========================================================= */
function setMode(mode) {
  if (mode !== "quiz" && mode !== "result") stopTimer();
  ui.mode = mode;
  $("studyView").hidden = mode !== "study";
  $("testView").hidden = !(mode === "test" || mode === "quiz");
  $("resultView").hidden = mode !== "result";
  $("tabStudy").setAttribute("aria-selected", String(mode === "study"));
  $("tabTest").setAttribute("aria-selected", String(mode === "test"));
  $("tabQuiz").setAttribute("aria-selected", String(mode === "quiz"));
}

function goStudy() {
  setMode("study");
  const fits = filterPredicate(ui.filter);
  if (ui.current >= 0 && fits(ui.current)) renderCard();
  else showNext();
}

function computeStats() {
  ensureToday();
  const t = today();
  let studied = 0, learned = 0, mastered = 0, hard = 0, fav = 0, due = 0, levelSum = 0, correct = 0, wrong = 0, seen = 0;
  for (let i = 0; i < cards.length; i++) {
    const p = progress[cards[i].id];
    if (!p) continue;
    if (p.f) fav++;
    if (p.s || p.n) seen++;
    if (!p.n) continue;
    studied++;
    correct += p.c;
    wrong += p.w;
    levelSum += Math.min(p.l, CONFIG.learnedLevel);
    if (p.h) hard++;
    else if (p.l >= CONFIG.learnedLevel) { learned++; if (p.l >= CONFIG.masteredLevel) mastered++; }
    if (p.d <= t) due++;
  }
  const total = cards.length;
  return {
    total, studied, learned, mastered, hard, fav, due, seen,
    fresh: total - studied,
    learning: studied - learned - hard,
    remaining: total - learned,
    todayWords: daily.ids.filter(id => idIndex.has(id)).length,
    todayAnswers: daily.reviews,
    learnedPct: total ? Math.round(learned / total * 1000) / 10 : 0,
    progressPct: total ? Math.round(levelSum / (total * CONFIG.learnedLevel) * 1000) / 10 : 0,
    accuracy: correct + wrong ? Math.round(correct / (correct + wrong) * 100) : 0,
    streak: (streak.last === t || streak.last === t - 1) ? streak.count : 0
  };
}

const fmt = n => n.toLocaleString("en-US");

function renderProgress() {
  const s = computeStats();
  const goal = CONFIG.dailyGoal;
  $("todayText").textContent = "Today: " + fmt(s.todayWords) + " / " + goal + " words";
  $("streakText").textContent = s.streak ? s.streak + "-day streak" : "Start your streak today";
  $("barGoal").style.width = Math.min(100, Math.round(s.todayWords / goal * 100)) + "%";
  $("goalBar").title = "Daily goal: " + goal + " words";
}

function fillStatGrid(dl, rows) {
  dl.innerHTML = "";
  for (const [label, value] of rows) {
    const div = document.createElement("div");
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = typeof value === "number" ? fmt(value) : value;
    div.append(dt, dd);
    dl.append(div);
  }
}


/* =========================================================
   SECTION 12: SEARCH
   Searches the Danish word, the English meaning, the Danish example
   and its English translation. Results that start
   with the search text come first. Click a result to study it.
   ========================================================= */
let searchTimer = null;

function runSearch() {
  const q = $("searchInput").value.trim().toLowerCase();
  const ul = $("searchResults");
  ul.innerHTML = "";
  if (!q) { ul.hidden = true; return; }

  // Rank: 1) word or English starts with the text, 2) word or English contains it, 3) example matches.
  const starts = [], contains = [], inExample = [];
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    if (c.search.indexOf(q) < 0) continue;
    const en = c.meaning.toLowerCase();
    if (c.lower.startsWith(q) || en.startsWith(q)) starts.push(i);
    else if (c.lower.includes(q) || en.includes(q)) contains.push(i);
    else inExample.push(i);
    if (starts.length >= CONFIG.searchLimit) break;
  }
  const found = starts.concat(contains, inExample).slice(0, CONFIG.searchLimit);

  const frag = document.createDocumentFragment();
  if (!found.length) {
    const li = document.createElement("li");
    li.className = "none";
    li.textContent = "No words match \u201c" + q + "\u201d.";
    frag.append(li);
  }
  for (const i of found) {
    const c = cards[i];
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.index = i;
    const a = document.createElement("span");
    a.className = "r-a";
    const b = document.createElement("span");
    b.className = "r-b";
    if (ui.dir === "da") { a.textContent = c.danish; a.lang = "da"; b.textContent = "  " + c.meaning; }
    else { a.textContent = c.meaning; b.textContent = "  " + c.danish; b.lang = "da"; }
    btn.append(a, b);
    if (!c.lower.includes(q) && !c.meaning.toLowerCase().includes(q)) {
      // matched inside an example: show the sentence that matched
      const ex = document.createElement("span");
      ex.className = "r-ex";
      const inDa = c.example.toLowerCase().includes(q);
      ex.lang = inDa ? "da" : "en";
      ex.textContent = inDa ? c.example : c.exampleEn;
      btn.append(ex);
    }
    li.append(btn);
    frag.append(li);
  }
  ul.append(frag);
  ul.hidden = false;
}

function closeSearch() { $("searchResults").hidden = true; }

function jumpTo(i) {
  $("searchInput").value = "";
  closeSearch();
  $("searchInput").blur();
  setMode("study");
  if (!filterPredicate(ui.filter)(i)) setFilter("all", true); // make sure the word fits the list
  showCard(i);
}


/* =========================================================
   SECTION 13: STATISTICS AND RESET
   ========================================================= */
function openStats() {
  const s = computeStats();
  // What every visitor sees: simple and motivating.
  fillStatGrid($("statsGrid"), [
    ["Words today", s.todayWords],
    ["Daily streak", s.streak + (s.streak === 1 ? " day" : " days")],
    ["Accuracy", s.accuracy + "%"],
    ["Words seen", s.seen]
  ]);

  // Owner panel (#admin): full numbers.
  $("adminPanel").hidden = !isAdmin;
  if (isAdmin) {
    const mine = cards.filter(c => c.source === "mine").length;
    const withEx = cards.filter(c => c.example).length;
    fillStatGrid($("adminGrid"), [
      ["Total words", s.total],
      ["My words", mine],
      ["Built-in words", s.total - mine],
      ["With example", withEx],
      ["New", s.fresh],
      ["Learning", s.learning],
      ["Hard", s.hard],
      ["Learned", s.learned],
      ["Mastered", s.mastered],
      ["Remaining", s.remaining],
      ["Learned %", s.learnedPct + "%"],
      ["Progress %", s.progressPct + "%"],
      ["Answers today", s.todayAnswers],
      ["Due today", s.due],
      ["Favorites", s.fav]
    ]);
    $("builtinToggle").checked = useBuiltIn;
    $("adminNote").textContent = (speechSupported()
      ? (voices.da ? "Voice: " + voices.da.name + ". " : "No Danish voice on this device. ")
      : "No speech support in this browser. ") +
      "Learned = 3 correct days, mastered = 5. Hard halves the level, Again or a wrong answer resets it.";
  }
  $("resetConfirm").hidden = true;
  $("statsDialog").showModal();
}

/* Reset happens inside the Stats window. "Reset progress" opens a box with
   tick boxes, so people can reset only what they want:
   - Learning progress: levels, hard marks, correct/wrong counts (accuracy),
     words seen, missed-words list and the card order. Favorites are kept.
   - Favorites: removes all stars, keeps learning progress.
   - Daily streak: sets the streak back to 0.
   - Today's words: clears today's word count.
   A browser confirm() popup is not used because some browsers block it. */
const RESET_BOXES = ["rsProgress", "rsFav", "rsStreak", "rsToday"];

function askReset() {
  $("rsProgress").checked = true;
  $("rsFav").checked = $("rsStreak").checked = $("rsToday").checked = false;
  updateResetButton();
  $("resetConfirm").hidden = false;
}
function cancelReset() { $("resetConfirm").hidden = true; }
function updateResetButton() {
  $("resetYesBtn").disabled = !RESET_BOXES.some(id => $(id).checked);
}

function resetProgress() {
  const doProgress = $("rsProgress").checked;
  const doFav = $("rsFav").checked;
  const doStreak = $("rsStreak").checked;
  const doToday = $("rsToday").checked;
  if (!doProgress && !doFav && !doStreak && !doToday) return;

  $("resetConfirm").hidden = true;
  clearTimeout(saveTimer);
  // Older version data, so it is never converted back in on a later visit.
  try { ["progress", "daily", "streak", "sched"].forEach(k => localStorage.removeItem(CONFIG.oldPrefix + k)); } catch (e) {}

  if (doProgress || doFav) {
    const kept = {};
    for (const id in progress) {
      const p = progress[id];
      const fav = doFav ? 0 : (p.f ? 1 : 0);
      if (doProgress) {
        if (fav) kept[id] = { l: 0, d: 0, h: 0, f: 1, s: 0, n: 0, c: 0, w: 0, r: 0, t: 0, u: 0 };
      } else {
        p.f = fav;
        kept[id] = p;
      }
    }
    progress = kept;
  }
  if (doProgress) {
    reviewIds = [];
    sched = null;
    filterBag = null;
    ui.history = [];
    initSchedule();
  }
  if (doStreak) streak = { last: 0, count: 0 };
  if (doToday) {
    daily = { day: today(), ids: [], reviews: 0 };
    dailySet = new Set();
  }

  stopTimer();
  saveAll();
  renderProgress();
  $("statsDialog").close();
  setMode("study");
  if (doProgress) { ui.current = -1; showNext(); } else { goStudy(); }

  const done = [doProgress && "learning progress", doFav && "favorites", doStreak && "streak", doToday && "today's words"].filter(Boolean);
  toast("Reset: " + done.join(", ") + ".");
}


/* =========================================================
   SECTION 14: PRONUNCIATION (browser SpeechSynthesis)
   - Danish text is always read by a Danish voice, English text by an
     English voice. A Danish word is never read by an English voice,
     because that teaches the wrong pronunciation.
   - The best Danish voice on the device is chosen automatically:
     natural/neural voices first (e.g. Microsoft Christel or Jeppe in Edge),
     then premium/enhanced voices (e.g. Apple Sara), then the rest.
   - Recorded MP3 files are used for Danish words when available (below).
   - Abbreviations (f.eks., dvs., osv. ...) are read as full words.
   ========================================================= */
const voices = { da: null, en: null, daList: [] };
let voicesLoaded = false;

function speechSupported() { return "speechSynthesis" in window && "SpeechSynthesisUtterance" in window; }

function langOf(v) { return String(v.lang || "").toLowerCase().replace("_", "-"); }

function voiceScore(v) {
  const n = v.name.toLowerCase();
  let s = 0;
  if (/natural|neural|online/.test(n)) s += 40;   // Edge online voices: by far the best quality
  if (/premium|enhanced|forbedret/.test(n)) s += 30;
  if (/google/.test(n)) s += 15;
  if (/christel|jeppe|sara|magnus|naja|mads|helle/.test(n)) s += 5;
  if (/compact|eloquence|espeak/.test(n)) s -= 20; // robotic voices last
  return s;
}

function loadVoices() {
  if (!speechSupported()) return;
  const all = speechSynthesis.getVoices();
  if (!all.length) return;
  voicesLoaded = true;
  voices.daList = all.filter(v => /^da(-|$)/.test(langOf(v))).sort((a, b) => voiceScore(b) - voiceScore(a));
  voices.da = voices.daList[0] || null;
  const en = all.filter(v => /^en(-|$)/.test(langOf(v)))
    .sort((a, b) => (voiceScore(b) + (langOf(b) === "en-gb" ? 3 : 0)) - (voiceScore(a) + (langOf(a) === "en-gb" ? 3 : 0)));
  voices.en = en[0] || null;
}

/* Read abbreviations and symbols the way a Dane says them. */
const DA_ABBR = [
  [/\bf\.eks\./gi, "for eksempel"], [/\bfx\b/gi, "for eksempel"], [/\bdvs\./gi, "det vil sige"],
  [/\bosv\./gi, "og så videre"], [/\bbl\.a\./gi, "blandt andet"], [/\bmht\./gi, "med hensyn til"],
  [/\bift\./gi, "i forhold til"], [/\bevt\./gi, "eventuelt"], [/\bca\./gi, "cirka"],
  [/\bkl\./gi, "klokken"], [/\bnr\./gi, "nummer"], [/\bpct\./gi, "procent"], [/\bkr\./gi, "kroner"],
  [/\bm\.m\./gi, "med mere"], [/\bo\.l\./gi, "og lignende"], [/\bjf\./gi, "jævnfør"],
  [/\bSoMe\b/g, "sociale medier"], [/\bCO2\b/gi, "C O to"], [/%/g, " procent"]
];
function cleanForSpeech(text, lang) {
  let s = String(text).replace(/\(.*?\)|\[.*?\]/g, " ").split("→")[0];
  if (lang === "da") for (const [re, rep] of DA_ABBR) s = s.replace(re, rep);
  return s.replace(/\s*\/\s*/g, ", ").replace(/\s+/g, " ").trim();
}

let warnedNoVoice = false;
function speak(text, lang) {
  lang = lang || "da";
  if (!speechSupported()) { toast("Pronunciation is not supported in this browser."); return; }
  if (!voicesLoaded) loadVoices();
  const voice = lang === "da" ? voices.da : voices.en;

  // No Danish voice on this device: do not let an English voice mispronounce Danish.
  if (lang === "da" && !voice && voicesLoaded) {
    toast("Pronunciation is not available for this word on this device.");
    return;
  }

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanForSpeech(text, lang));
  u.lang = voice ? voice.lang : (lang === "da" ? "da-DK" : "en-GB");
  if (voice) u.voice = voice;
  u.rate = lang === "da" ? CONFIG.speechRate : 1;
  speechSynthesis.speak(u);
}

/* ---- Recorded word audio ----
   Every Danish word has an MP3 file in the "audio" folder, made once with a
   natural Danish voice (see generate_audio.py). Playing a small MP3 works on
   every device, also old phones, with no Danish voice installed.
   If a file is missing (for example a word added later), the browser's own
   Danish voice is used instead.
   File name = the spoken text in lower case, with spaces as "-" and every
   other character that is not a-z or 0-9 written as "_" + its code,
   e.g. "fører" -> "f_f8rer.mp3". generate_audio.py uses the same rule. */
const AUDIO_FOLDER = "audio/";
const missingAudio = new Set();
let player = null;

function audioName(text) {
  const s = cleanForSpeech(text, "da").toLowerCase();
  let out = "";
  for (const ch of s) {
    if (/[a-z0-9]/.test(ch)) out += ch;
    else if (ch === " ") out += "-";
    else out += "_" + ch.codePointAt(0).toString(16);
  }
  return out;
}

function speakWord(text) {
  const name = audioName(text);
  if (!name || missingAudio.has(name) || typeof Audio === "undefined") { speak(text, "da"); return; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  if (!player) player = new Audio();
  player.pause();
  let fellBack = false;
  const fallback = () => {
    if (fellBack) return;
    fellBack = true;
    missingAudio.add(name);
    speak(text, "da");
  };
  player.onerror = fallback;
  player.src = AUDIO_FOLDER + name + ".mp3";
  const p = player.play();
  if (p && p.catch) p.catch(err => { if (!err || err.name !== "NotAllowedError") fallback(); });
}

/* Which text to read for the card or question on screen.
   Danish → English: always the Danish word.
   English → Danish: the English meaning until the answer is shown, then the Danish word. */
function speakCurrent() {
  if (ui.mode === "study" && ui.current >= 0) {
    const c = cards[ui.current];
    if (ui.dir === "en" && !ui.flipped) speak(c.meaning, "en"); else speakWord(c.danish);
  } else if ((ui.mode === "test" || ui.mode === "quiz") && session.q) {
    const c = cards[session.q.i];
    if (ui.dir === "en" && !session.answered) speak(c.meaning, "en"); else speakWord(c.danish);
  }
}

if (speechSupported()) {
  loadVoices();
  speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged", loadVoices) : (speechSynthesis.onvoiceschanged = loadVoices);
  // Some browsers fill the voice list late: try again a few times.
  [250, 1000, 2500].forEach(ms => setTimeout(loadVoices, ms));
}


/* =========================================================
   SECTION 15: THEME, LISTS AND SMALL HELPERS
   ========================================================= */
function applyTheme(theme) {
  if (theme === "dark") document.documentElement.dataset.theme = "dark";
  else delete document.documentElement.dataset.theme;
  $("themeBtn").textContent = theme === "dark" ? "Light mode" : "Dark mode";
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  store.set("theme", next);
  applyTheme(next);
}

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

function setFilter(key, silent) {
  ui.filter = key;
  $("filterSelect").value = key;
  store.set("filter", key);
  filterBag = null;
  if (silent) return;
  if (ui.mode === "study") showNext();
  else if (ui.mode === "test") startSession("test");
}

/* Add category options if any word has a "category" field. */
function addAdminOptions() {
  if (!isAdmin) return;
  const group = document.createElement("optgroup");
  group.label = "Owner";
  for (const [v, label] of [["mine", "My words"], ["common", "Built-in common words"]]) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = label;
    group.append(o);
  }
  $("filterSelect").append(group);
}

function addCategoryOptions() {
  const cats = [...new Set(cards.map(c => c.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "da"));
  if (!cats.length) return;
  const group = document.createElement("optgroup");
  group.label = "Categories";
  for (const cat of cats) {
    const o = document.createElement("option");
    o.value = "cat:" + cat;
    o.textContent = cat;
    group.append(o);
  }
  $("filterSelect").append(group);
}

function currentWordIndex() {
  if (ui.mode === "study") return ui.current;
  if ((ui.mode === "test" || ui.mode === "quiz") && session.q) return session.q.i;
  return -1;
}


/* =========================================================
   SECTION 16: BUTTONS AND KEYBOARD SHORTCUTS
   ========================================================= */
function on(id, fn) {
  $(id).addEventListener("click", e => {
    if (e.detail > 0) e.currentTarget.blur(); // after a mouse click, Space flips the card instead of re-clicking
    fn(e);
  });
}

$("card").addEventListener("click", flip);
on("favBtn", e => { e.stopPropagation(); toggleFavorite(ui.current); renderCard(); });
on("speakBtn", e => { e.stopPropagation(); speakCurrent(); });
on("againBtn", () => rate("again"));
on("hardBtn", () => rate("hard"));
on("easyBtn", () => rate("easy"));
on("nextBtn", () => showNext());
on("backBtn", goBack);
on("showAllBtn", () => setFilter("all"));

on("tabStudy", goStudy);
on("tabTest", () => startSession("test"));
on("tabQuiz", () => startSession("quiz"));
on("dirDa", () => setDirection("da"));
on("dirEn", () => setDirection("en"));
$("filterSelect").addEventListener("change", e => setFilter(e.target.value));

on("yesBtn", () => answer(true));
on("noBtn", () => answer(false));
on("qNextBtn", goNextQuestion);
on("endBtn", finishSession);
on("qSpeakBtn", speakCurrent);
on("qFavBtn", () => { if (session.q) setFavButton($("qFavBtn"), toggleFavorite(session.q.i)); });

on("studyMissedBtn", () => { setMode("study"); setFilter("review"); });
on("testMissedBtn", () => startSession("test", session.missed));
on("againSessionBtn", () => startSession(session.kind === "quiz" ? "quiz" : "test"));
on("backStudyBtn", goStudy);

on("statsBtn", openStats);
on("closeStatsBtn", () => $("statsDialog").close());
on("themeBtn", toggleTheme);
on("resetBtn", askReset);
on("resetNoBtn", cancelReset);
on("resetYesBtn", resetProgress);
RESET_BOXES.forEach(id => $(id).addEventListener("change", updateResetButton));
$("builtinToggle").addEventListener("change", e => {
  store.set("builtin", e.target.checked);
  saveAll();
  location.reload();   // rebuild the word list
});

$("searchInput").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 100);
});
$("searchInput").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.target.value = ""; closeSearch(); e.target.blur(); }
  if (e.key === "Enter") {
    runSearch();
    const first = $("searchResults").querySelector("button");
    if (first) jumpTo(Number(first.dataset.index));
  }
  if (e.key === "ArrowDown") {
    const first = $("searchResults").querySelector("button");
    if (first) { e.preventDefault(); first.focus(); }
  }
});
$("searchResults").addEventListener("click", e => {
  const btn = e.target.closest("button[data-index]");
  if (btn) jumpTo(Number(btn.dataset.index));
});
$("searchResults").addEventListener("keydown", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const li = btn.parentElement;
  if (e.key === "ArrowDown" && li.nextElementSibling) { e.preventDefault(); li.nextElementSibling.querySelector("button").focus(); }
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (li.previousElementSibling) li.previousElementSibling.querySelector("button").focus();
    else $("searchInput").focus();
  }
  if (e.key === "Escape") { closeSearch(); $("searchInput").focus(); }
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) closeSearch(); });

let spaceHandled = false;
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest("input, textarea, select, .results")) return;
  if ($("statsDialog").open) return;
  const k = e.key.toLowerCase();
  const isSpace = e.code === "Space" || e.key === " ";

  if (k === "/") { e.preventDefault(); $("searchInput").focus(); return; }
  if (k === "d") { setDirection(ui.dir === "da" ? "en" : "da"); return; }
  if (k === "s") { speakCurrent(); return; }

  if (ui.mode === "study") {
    if (isSpace) { e.preventDefault(); spaceHandled = true; flip(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); showNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
    else if (k === "e") rate("easy");
    else if (k === "h") rate("hard");
    else if (k === "a") rate("again");
    else if (k === "f") { toggleFavorite(ui.current); renderCard(); }
  } else if (ui.mode === "test" || ui.mode === "quiz") {
    if (!session.answered) {
      if (k === "c") answer(true);
      else if (k === "x") answer(false);
    } else if (isSpace || e.key === "Enter" || e.key === "ArrowRight") {
      e.preventDefault();
      if (isSpace) spaceHandled = true;
      goNextQuestion();
    }
  }
});
document.addEventListener("keyup", e => {
  if (spaceHandled && (e.code === "Space" || e.key === " ")) { e.preventDefault(); spaceHandled = false; }
});


/* =========================================================
   SECTION 17: START
   ========================================================= */
(function start() {
  applyTheme(store.get("theme", null) || store.get("theme", "light", CONFIG.oldPrefix));
  addCategoryOptions();
  addAdminOptions();
  if (![...$("filterSelect").options].some(o => o.value === ui.filter)) ui.filter = "all";
  $("filterSelect").value = ui.filter;
  $("dirDa").setAttribute("aria-pressed", String(ui.dir === "da"));
  $("dirEn").setAttribute("aria-pressed", String(ui.dir === "en"));

  ensureToday();
  initSchedule();
  saveAll();          // stores converted version 1 progress right away
  renderProgress();

  // Continue with the card that was on screen last time, if it still fits the chosen list.
  const last = sched.current != null ? idIndex.get(sched.current) : undefined;
  if (last !== undefined && filterPredicate(ui.filter)(last)) {
    ui.current = last;
    renderCard();
  } else {
    showNext();
  }
})();
</script>
